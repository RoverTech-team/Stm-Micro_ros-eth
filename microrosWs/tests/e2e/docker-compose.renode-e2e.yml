services:
  firmware-build:
    build:
      context: .
      dockerfile: Dockerfile.firmware-build
    working_dir: /workspace
    command:
      - /usr/local/bin/firmware-build.sh
    environment:
      - FIRMWARE_PROJECT_DIR=${FIRMWARE_PROJECT_DIR:-/workspace/microrosWs/Micro_ros_eth/microroseth}
      - BUILD_MICROROS_LIB=${BUILD_MICROROS_LIB:-auto}
      - BUILD_FIRMWARE=${BUILD_FIRMWARE:-1}
      - MICROROS_BUILDER_TAG=${MICROROS_BUILDER_TAG:-humble}
      - HOST_WORKSPACE_DIR=${HOST_WORKSPACE_DIR:-${PWD}/../../..}
    volumes:
      - ../../../:/workspace:rw
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - renode_e2e_net

  firmware-build-lib:
    profiles:
      - lib-build
    build:
      context: .
      dockerfile: Dockerfile.firmware-build
    working_dir: /workspace
    command:
      - /usr/local/bin/firmware-build.sh
    environment:
      - FIRMWARE_PROJECT_DIR=${FIRMWARE_PROJECT_DIR:-/workspace/microrosWs/Micro_ros_eth/microroseth}
      - BUILD_MICROROS_LIB=${BUILD_MICROROS_LIB:-force}
      - BUILD_FIRMWARE=0
      - MICROROS_BUILDER_TAG=${MICROROS_BUILDER_TAG:-humble}
      - HOST_WORKSPACE_DIR=${HOST_WORKSPACE_DIR:-${PWD}/../../..}
    volumes:
      - ../../../:/workspace:rw
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - renode_e2e_net

  microk3:
    build:
      context: ../../microk3
      dockerfile: Dockerfile
    ports:
      - "${DASHBOARD_PORT:-5050}:5050"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=false
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5050
      - SECRET_KEY=${SECRET_KEY:-e2e-test-secret-key}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-testpass123}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - DATA_FILE=/app/data/system_data.json
      - LOG_FILE=/app/logs/microk3.log
      - MICROROS_DISABLE_SHM=1
      - MICROK3_METRICS_DOCKER_SERVICES=${MICROK3_METRICS_DOCKER_SERVICES:-microk3,renode-bridge,renode-e2e}
    volumes:
      - microk3_e2e_data:/app/data
      - microk3_e2e_logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - renode_e2e_net

  renode-bridge:
    build:
      context: ../../microk3
      dockerfile: Dockerfile
    command: ["python3", "tools/renode_heartbeat_bridge.py"]
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - MICROROS_DISABLE_SHM=1
      - RENODE_NODE_ID=${RENODE_NODE_ID:-755}
      - RENODE_NODE_NAME=${RENODE_NODE_NAME:-renode-stm32h755}
      - RENODE_NODE_TYPE=${RENODE_NODE_TYPE:-Renode STM32H755}
      - RENODE_NODE_NETWORK=${RENODE_NODE_NETWORK:-Docker Renode TAP}
      - RENODE_HEARTBEAT_TOPIC=${RENODE_HEARTBEAT_TOPIC:-heartbeat}
      - RENODE_HEARTBEAT_TELEMETRY_TOPIC=${RENODE_HEARTBEAT_TELEMETRY_TOPIC:-heartbeat_telemetry}
      - RENODE_POSITION_TELEMETRY_TOPIC=${RENODE_POSITION_TELEMETRY_TOPIC:-}
      - MICROK3_TIME_SYNC_REQUEST_TOPIC=${MICROK3_TIME_SYNC_REQUEST_TOPIC:-time_sync_request}
      - MICROK3_TIME_SYNC_ECHO_TOPIC=${MICROK3_TIME_SYNC_ECHO_TOPIC:-time_sync_echo}
      - RENODE_HEARTBEAT_TIMEOUT_SEC=${RENODE_HEARTBEAT_TIMEOUT_SEC:-5.0}
      - MICROK3_STATUS_TOPIC=${MICROK3_STATUS_TOPIC:-microk3/node_status}
      - MICROK3_ALERT_TOPIC=${MICROK3_ALERT_TOPIC:-microk3/system_alerts}
      - MICROK3_COMMAND_TOPIC=${MICROK3_COMMAND_TOPIC:-microk3/commands}
      - MICROK3_METRICS_TOPIC=${MICROK3_METRICS_TOPIC:-microk3/performance_metrics}
      - MICROK3_METRICS_PUBLISH_SEC=${MICROK3_METRICS_PUBLISH_SEC:-1.0}
    depends_on:
      microk3:
        condition: service_healthy
      renode-e2e:
        condition: service_started
    networks:
      - renode_e2e_net

  renode-e2e:
    build:
      context: .
      dockerfile: Dockerfile.renode-e2e
    privileged: true
    cap_add:
      - NET_ADMIN
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - MICROROS_DISABLE_SHM=1
      - TAP_INTERFACE=${TAP_INTERFACE:-tap0}
      - TAP_GATEWAY_CIDR=${TAP_GATEWAY_CIDR:-192.168.50.1/24}
      - AGENT_PORT=${AGENT_PORT:-8888}
      - AGENT_START_DELAY_SEC=${AGENT_START_DELAY_SEC:-0}
      - AGENT_RESTART_AFTER_SEC=${AGENT_RESTART_AFTER_SEC:-0}
      - AGENT_RESTART_DOWNTIME_SEC=${AGENT_RESTART_DOWNTIME_SEC:-0}
      - TAP_FLAP_AFTER_SEC=${TAP_FLAP_AFTER_SEC:-0}
      - TAP_FLAP_DOWNTIME_SEC=${TAP_FLAP_DOWNTIME_SEC:-0}
      - RENODE_RESTART_AFTER_SEC=${RENODE_RESTART_AFTER_SEC:-0}
      - RENODE_RESTART_DOWNTIME_SEC=${RENODE_RESTART_DOWNTIME_SEC:-0}
      - RENODE_SCRIPT=${RENODE_SCRIPT:-/workspace/microrosWs/tests/e2e/renode/microroseth_docker_tap.resc}
      - FIRMWARE_PROJECT_DIR=${FIRMWARE_PROJECT_DIR:-/workspace/microrosWs/Micro_ros_eth/microroseth}
      - CM4_MAKE_DIR=${FIRMWARE_PROJECT_DIR:-/workspace/microrosWs/Micro_ros_eth/microroseth}/Makefile/CM4
      - CM7_MAKE_DIR=${FIRMWARE_PROJECT_DIR:-/workspace/microrosWs/Micro_ros_eth/microroseth}/Makefile/CM7
      - WORKSPACE=/workspace
      - CM4_ELF=${FIRMWARE_PROJECT_DIR:-/workspace/microrosWs/Micro_ros_eth/microroseth}/Makefile/CM4/build/MicroRosEth_CM4.elf
      - CM7_ELF=${FIRMWARE_PROJECT_DIR:-/workspace/microrosWs/Micro_ros_eth/microroseth}/Makefile/CM7/build/MicroRosEth_CM7.elf
    volumes:
      - ../../../:/workspace:rw
    networks:
      - renode_e2e_net
    depends_on:
      firmware-build:
        condition: service_completed_successfully

networks:
  renode_e2e_net:
    driver: bridge

volumes:
  microk3_e2e_data:
  microk3_e2e_logs:
