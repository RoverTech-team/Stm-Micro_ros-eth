services:
  micro-ros-agent:
    platform: linux/arm64
    build:
      context: .
      dockerfile: agent.Dockerfile
    network_mode: host
    environment:
      - AGENT_PORT=${AGENT_PORT:-8888}
      - AGENT_BIND_ADDR=${AGENT_BIND_ADDR:-0.0.0.0}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    command:
      [
        "udp4",
        "-p",
        "${AGENT_PORT:-8888}",
        "-v",
        "4",
        "-d",
        "${ROS_DOMAIN_ID:-0}",
      ]

  arm-bridge:
    platform: linux/arm64
    build:
      context: ../../microrosWs/microk3
      dockerfile: Dockerfile
    network_mode: host
    command: ["python3", "/bridge/arm_bridge.py"]
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ROS_LOCALHOST_ONLY=0
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      - RMW_FASTRTPS_USE_SHM=0
      - MICROROS_DISABLE_SHM=1
      - ARM_STATES_INPUT_TOPIC=${ARM_STATES_INPUT_TOPIC:-/joint_states}
      - ARM_COMMANDS_OUTPUT_TOPIC=${ARM_COMMANDS_OUTPUT_TOPIC:-/joint_commands}
      - ARM_STATES_OUTPUT_TOPIC=${ARM_STATES_OUTPUT_TOPIC:-/hardware_level/states}
      - ARM_COMMANDS_INPUT_TOPIC=${ARM_COMMANDS_INPUT_TOPIC:-/hardware_level/commands}
    volumes:
      - ./scripts/arm_bridge.py:/bridge/arm_bridge.py:ro
    depends_on:
      micro-ros-agent:
        condition: service_started

  microk3:
    platform: linux/arm64
    build:
      context: ../../microrosWs/microk3
      dockerfile: Dockerfile
    network_mode: host
    command: ["gunicorn", "--bind", "0.0.0.0:5051", "--workers", "1", "--threads", "8", "--worker-class", "gthread", "--timeout", "0", "runtime:app"]
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=false
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5051
      - SECRET_KEY=${SECRET_KEY:-e2e-test-secret-key}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-testpass123}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ROS_LOCALHOST_ONLY=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - RMW_FASTRTPS_USE_SHM=0
      - DATA_FILE=/app/data/system_data.json
      - LOG_FILE=/app/logs/microk3.log
      - MICROROS_DISABLE_SHM=1
      - SSH_TERMINAL_ENABLED=${SSH_TERMINAL_ENABLED:-true}
      - SSH_TERMINAL_HOST=${SSH_TERMINAL_HOST:-127.0.0.1}
      - SSH_TERMINAL_PORT=${SSH_TERMINAL_PORT:-22}
      - SSH_TERMINAL_USERNAME=${SSH_TERMINAL_USERNAME:-}
      - SSH_TERMINAL_AUTH_METHOD=${SSH_TERMINAL_AUTH_METHOD:-key}
      - SSH_TERMINAL_KEY_PATH=/run/secrets/ssh_terminal_key
      - SSH_TERMINAL_KNOWN_HOSTS_PATH=/run/secrets/ssh_terminal_known_hosts
      - SSH_TERMINAL_IDLE_TIMEOUT_SEC=${SSH_TERMINAL_IDLE_TIMEOUT_SEC:-1800}
      - TRUSTED_PROXY_HOPS=${TRUSTED_PROXY_HOPS:-1}
    volumes:
      - microk3_hil_data:/app/data
      - microk3_hil_logs:/app/logs
      - ${SSH_TERMINAL_KEY_PATH_HOST:-/dev/null}:/run/secrets/ssh_terminal_key:ro
      - ${SSH_TERMINAL_KNOWN_HOSTS_PATH_HOST:-/dev/null}:/run/secrets/ssh_terminal_known_hosts:ro
      - ../../microrosWs/microk3/Model3D_mesh2.obj:/app/Model3D_mesh2.obj:ro
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:5051/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    network_mode: host
    volumes:
      - ./Caddyfile.host:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      microk3:
        condition: service_healthy
    restart: unless-stopped

  renode-bridge:
    platform: linux/arm64
    build:
      context: ../../microrosWs/microk3
      dockerfile: Dockerfile
    command: ["python3", "tools/renode_heartbeat_bridge.py"]
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ROS_LOCALHOST_ONLY=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - RMW_FASTRTPS_USE_SHM=0
      - MICROROS_DISABLE_SHM=1
      - RENODE_NODE_ID=${RENODE_NODE_ID:-755}
      - RENODE_NODE_NAME=${RENODE_NODE_NAME:-stm32h755}
      - RENODE_NODE_TYPE=${RENODE_NODE_TYPE:-STM32H755}
      - RENODE_NODE_NETWORK=${RENODE_NODE_NETWORK:-Ethernet}
      - RENODE_HEARTBEAT_TOPIC=${RENODE_HEARTBEAT_TOPIC:-heartbeat}
      - RENODE_HEARTBEAT_TELEMETRY_TOPIC=${RENODE_HEARTBEAT_TELEMETRY_TOPIC:-heartbeat_telemetry}
      - RENODE_POSITION_TELEMETRY_TOPIC=${RENODE_POSITION_TELEMETRY_TOPIC:-measured_position_telemetry}
      - MICROK3_TIME_SYNC_REQUEST_TOPIC=${MICROK3_TIME_SYNC_REQUEST_TOPIC:-time_sync_request}
      - MICROK3_TIME_SYNC_ECHO_TOPIC=${MICROK3_TIME_SYNC_ECHO_TOPIC:-time_sync_echo}
      - RENODE_HEARTBEAT_TIMEOUT_SEC=${RENODE_HEARTBEAT_TIMEOUT_SEC:-5.0}
      - MICROK3_STATUS_TOPIC=${MICROK3_STATUS_TOPIC:-microk3/node_status}
      - MICROK3_ALERT_TOPIC=${MICROK3_ALERT_TOPIC:-microk3/system_alerts}
      - MICROK3_COMMAND_TOPIC=${MICROK3_COMMAND_TOPIC:-microk3/commands}
      - MICROK3_METRICS_TOPIC=${MICROK3_METRICS_TOPIC:-microk3/performance_metrics}
      - MICROK3_METRICS_PUBLISH_SEC=${MICROK3_METRICS_PUBLISH_SEC:-1.0}
      - HEARTBEAT_LOG_INTERVAL_SEC=${HEARTBEAT_LOG_INTERVAL_SEC:-30}
    depends_on:
      microk3:
        condition: service_healthy
      micro-ros-agent:
        condition: service_started

volumes:
  microk3_hil_data:
  microk3_hil_logs:
  caddy_data:
  caddy_config:
