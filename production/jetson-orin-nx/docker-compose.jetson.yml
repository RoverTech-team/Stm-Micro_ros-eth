services:
  firmware-build:
    platform: linux/arm64
    build:
      context: ../../microrosWs/tests/e2e
      dockerfile: Dockerfile.firmware-build
    working_dir: /workspace
    command:
      - /usr/local/bin/firmware-build.sh
    environment:
      - BUILD_MICROROS_LIB=${BUILD_MICROROS_LIB:-auto}
      - BUILD_FIRMWARE=${BUILD_FIRMWARE:-1}
      - MICROROS_BUILDER_TAG=${MICROROS_BUILDER_TAG:-humble}
      - MICROROS_AGENT_IP=${MICROROS_AGENT_IP:-192.168.2.17}
      - HOST_WORKSPACE_DIR=${HOST_WORKSPACE_DIR:-${PWD}}
    volumes:
      - ../../:/workspace:rw
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - renode_jetson_net

  firmware-build-lib:
    platform: linux/arm64
    build:
      context: ../../microrosWs/tests/e2e
      dockerfile: Dockerfile.firmware-build
    working_dir: /workspace
    command:
      - /usr/local/bin/firmware-build.sh
    environment:
      - BUILD_MICROROS_LIB=${BUILD_MICROROS_LIB:-force}
      - BUILD_FIRMWARE=0
      - MICROROS_BUILDER_TAG=${MICROROS_BUILDER_TAG:-humble}
      - MICROROS_AGENT_IP=${MICROROS_AGENT_IP:-192.168.2.17}
      - HOST_WORKSPACE_DIR=${HOST_WORKSPACE_DIR:-${PWD}}
    volumes:
      - ../../:/workspace:rw
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - renode_jetson_net

  microk3:
    platform: linux/arm64
    build:
      context: ../../microrosWs/microk3
      dockerfile: Dockerfile
    expose:
      - "5050"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=false
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5050
      - SECRET_KEY=${SECRET_KEY:-e2e-test-secret-key}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-testpass123}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - DATA_FILE=/app/data/system_data.json
      - LOG_FILE=/app/logs/microk3.log
      - MICROROS_DISABLE_SHM=1
      - SSH_TERMINAL_ENABLED=${SSH_TERMINAL_ENABLED:-true}
      - SSH_TERMINAL_HOST=${SSH_TERMINAL_HOST:-127.0.0.1}
      - SSH_TERMINAL_PORT=${SSH_TERMINAL_PORT:-22}
      - SSH_TERMINAL_USERNAME=${SSH_TERMINAL_USERNAME:-}
      - SSH_TERMINAL_AUTH_METHOD=${SSH_TERMINAL_AUTH_METHOD:-key}
      - SSH_TERMINAL_KEY_PATH=/run/secrets/ssh_terminal_key
      - SSH_TERMINAL_KNOWN_HOSTS_PATH=/run/secrets/ssh_terminal_known_hosts
      - SSH_TERMINAL_IDLE_TIMEOUT_SEC=${SSH_TERMINAL_IDLE_TIMEOUT_SEC:-1800}
      - TRUSTED_PROXY_HOPS=${TRUSTED_PROXY_HOPS:-1}
    volumes:
      - microk3_jetson_data:/app/data
      - microk3_jetson_logs:/app/logs
      - ${SSH_TERMINAL_KEY_PATH_HOST:-/dev/null}:/run/secrets/ssh_terminal_key:ro
      - ${SSH_TERMINAL_KNOWN_HOSTS_PATH_HOST:-/dev/null}:/run/secrets/ssh_terminal_known_hosts:ro
      - ../../microrosWs/microk3/Model3D_mesh2.obj:/app/Model3D_mesh2.obj:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - renode_jetson_net

  caddy:
    image: caddy:2-alpine
    ports:
      - "${DASHBOARD_PORT:-5050}:5050"
      - "${DASHBOARD_HTTP_PORT:-8080}:8080"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      microk3:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - renode_jetson_net

  renode-bridge:
    platform: linux/arm64
    build:
      context: ../../microrosWs/microk3
      dockerfile: Dockerfile
    command: ["python3", "tools/renode_heartbeat_bridge.py"]
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - MICROROS_DISABLE_SHM=1
      - RENODE_NODE_ID=${RENODE_NODE_ID:-755}
      - RENODE_NODE_NAME=${RENODE_NODE_NAME:-renode-stm32h755}
      - RENODE_NODE_TYPE=${RENODE_NODE_TYPE:-Renode STM32H755}
      - RENODE_NODE_NETWORK=${RENODE_NODE_NETWORK:-Docker Renode TAP}
      - RENODE_HEARTBEAT_TOPIC=${RENODE_HEARTBEAT_TOPIC:-heartbeat}
      - RENODE_HEARTBEAT_TELEMETRY_TOPIC=${RENODE_HEARTBEAT_TELEMETRY_TOPIC:-heartbeat_telemetry}
      - RENODE_POSITION_TELEMETRY_TOPIC=${RENODE_POSITION_TELEMETRY_TOPIC:-}
      - MICROK3_TIME_SYNC_REQUEST_TOPIC=${MICROK3_TIME_SYNC_REQUEST_TOPIC:-time_sync_request}
      - MICROK3_TIME_SYNC_ECHO_TOPIC=${MICROK3_TIME_SYNC_ECHO_TOPIC:-time_sync_echo}
      - RENODE_HEARTBEAT_TIMEOUT_SEC=${RENODE_HEARTBEAT_TIMEOUT_SEC:-5.0}
      - MICROK3_STATUS_TOPIC=${MICROK3_STATUS_TOPIC:-microk3/node_status}
      - MICROK3_ALERT_TOPIC=${MICROK3_ALERT_TOPIC:-microk3/system_alerts}
      - MICROK3_COMMAND_TOPIC=${MICROK3_COMMAND_TOPIC:-microk3/commands}
      - MICROK3_METRICS_TOPIC=${MICROK3_METRICS_TOPIC:-microk3/performance_metrics}
      - MICROK3_METRICS_PUBLISH_SEC=${MICROK3_METRICS_PUBLISH_SEC:-1.0}
    depends_on:
      microk3:
        condition: service_healthy
      renode-e2e:
        condition: service_started
    networks:
      - renode_jetson_net

  renode-e2e:
    platform: linux/arm64
    build:
      context: ../../microrosWs/tests/e2e
      dockerfile: Dockerfile.renode-e2e
    privileged: true
    cap_add:
      - NET_ADMIN
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - MICROROS_DISABLE_SHM=1
      - TAP_INTERFACE=${TAP_INTERFACE:-tap0}
      - TAP_GATEWAY_CIDR=${TAP_GATEWAY_CIDR:-192.168.50.1/24}
      - AGENT_PORT=${AGENT_PORT:-8888}
      - AGENT_START_DELAY_SEC=${AGENT_START_DELAY_SEC:-0}
      - AGENT_RESTART_AFTER_SEC=${AGENT_RESTART_AFTER_SEC:-0}
      - AGENT_RESTART_DOWNTIME_SEC=${AGENT_RESTART_DOWNTIME_SEC:-0}
      - TAP_FLAP_AFTER_SEC=${TAP_FLAP_AFTER_SEC:-0}
      - TAP_FLAP_DOWNTIME_SEC=${TAP_FLAP_DOWNTIME_SEC:-0}
      - RENODE_RESTART_AFTER_SEC=${RENODE_RESTART_AFTER_SEC:-0}
      - RENODE_RESTART_DOWNTIME_SEC=${RENODE_RESTART_DOWNTIME_SEC:-0}
      - RENODE_SCRIPT=${RENODE_SCRIPT:-/workspace/microrosWs/tests/e2e/renode/microroseth_docker_tap.resc}
      - WORKSPACE=/workspace
      - CM4_ELF=/workspace/microrosWs/Micro_ros_eth/microroseth/Makefile/CM4/build/MicroRosEth_CM4.elf
      - CM7_ELF=/workspace/microrosWs/Micro_ros_eth/microroseth/Makefile/CM7/build/MicroRosEth_CM7.elf
    volumes:
      - ../../:/workspace:rw
    networks:
      - renode_jetson_net
    depends_on:
      firmware-build:
        condition: service_completed_successfully

networks:
  renode_jetson_net:
    driver: bridge

volumes:
  microk3_jetson_data:
  microk3_jetson_logs:
  caddy_data:
  caddy_config:
